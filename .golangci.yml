version: "2"
run:
  tests: true
  timeout: 10m
linters:
  default: none
  enable:
    - bidichk
    - copyloopvar
    - depguard
    - durationcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        # The root api package holds the REST/WS wire types only (tx is needed by
        # RawTx.Decode and the subscription filter Match methods).
        api-types:
          list-mode: strict
          files:
            - "**/api/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/vechain/thor/v2/thor
            - github.com/ethereum/go-ethereum/common
            - github.com/vechain/thor/v2/tx
        # Client-side packages must not depend on node internals.
        # thorclient/deps_test.go checks the same list transitively.
        light-client:
          files:
            - "**/thorclient/**"
            - "**/builtin/contracts/**"
            - "!$test"
          deny:
            - pkg: github.com/vechain/thor/v2/api/
              desc: api subpackages (handlers, convert) are server-side; use the root api package
            - pkg: github.com/vechain/thor/v2/builtin$
              desc: pulls in state; use builtin/contracts
            - pkg: github.com/vechain/thor/v2/builtin/staker
              desc: node internal
            - pkg: github.com/vechain/thor/v2/bft
              desc: node internal
            - pkg: github.com/vechain/thor/v2/chain
              desc: node internal
            - pkg: github.com/vechain/thor/v2/cmd
              desc: node internal
            - pkg: github.com/vechain/thor/v2/comm
              desc: node internal
            - pkg: github.com/vechain/thor/v2/logdb
              desc: node internal
            - pkg: github.com/vechain/thor/v2/muxdb
              desc: node internal
            - pkg: github.com/vechain/thor/v2/p2p
              desc: node internal
            - pkg: github.com/vechain/thor/v2/runtime
              desc: node internal
            - pkg: github.com/vechain/thor/v2/state
              desc: node internal
            - pkg: github.com/vechain/thor/v2/txpool
              desc: node internal
            - pkg: github.com/vechain/thor/v2/vm
              desc: node internal
    gosec:
      excludes:
        - G115
        - G406
        - G507
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - upperCaseConst: true
          severity: warning
          disabled: false
          exclude:
            - "builtin/staker/types/*"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: vm/contracts.go
        text: 'SA1019: "golang.org/x/crypto/ripemd160" is deprecated: RIPEMD-160 is a legacy hash and should not be used for new applications.'
    paths:
      - third_party$
      - builtin$
      - examples$
      - p2p/*
issues:
  max-issues-per-linter: 1000
formatters:
  enable:
    - goimports
    - gofmt
    - gofumpt
    - golines
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/vechain/thor
    golines:
      max-len: 160
      tab-len: 4
      reformat-tags: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - p2p/*
