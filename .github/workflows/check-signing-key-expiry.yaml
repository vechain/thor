name: Check Signing Key Expiry

permissions:
  contents: read

on:
  schedule:
    # Daily at 09:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check Signing Key Expiry
    runs-on: ubuntu-latest
    outputs:
      days: ${{ steps.expiry.outputs.days }}
      expires_on: ${{ steps.expiry.outputs.expires_on }}
      notify: ${{ steps.expiry.outputs.notify }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read signing subkey expiry
        id: expiry
        shell: bash
        run: |
          set -euo pipefail

          # Latest-expiring non-revoked subkey with signing (s) capability.
          read -r expiry keyid < <(gpg --show-keys --with-colons docs/release-signing-key.asc \
            | awk -F: '$1=="sub" && $2!="r" && $12 ~ /s/ { print $7, $5 }' \
            | sort -n | tail -1) || true

          if [ -z "${expiry:-}" ]; then
            echo "::error::no signing subkey with expiry found"
            exit 1
          fi

          days=$(( (expiry - $(date +%s)) / 86400 ))
          expires_on=$(date -u -d @"$expiry" +%Y-%m-%d)

          notify=false
          case "$days" in
            15|7|3|1) notify=true ;;
          esac
          if [ "$days" -le 0 ]; then
            notify=true
          fi

          {
            echo "days=$days"
            echo "expires_on=$expires_on"
            echo "notify=$notify"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release signing key"
            echo
            echo "| Signing subkey | Expires on | Days left |"
            echo "|---|---|---|"
            echo "| \`$keyid\` | **$expires_on** | $days |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$days" -le 0 ]; then
            echo "::error::signing subkey expired on $expires_on"
            exit 1
          fi

  notify-slack:
    name: Notify Slack
    needs: check
    if: always() && needs.check.outputs.notify == 'true'
    uses: ./.github/workflows/notify-slack.yaml
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      payload: |
        {
          "unit-test-status": ":alert: Release signing key expires on ${{ needs.check.outputs.expires_on }} (${{ needs.check.outputs.days }} days left)",
          "docker-publish-status": ":fast_forward: Skipped",
          "commit-message": "Rotate the signing subkey: see the signing key runbook (Operations space in Confluence)",
          "commit-url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
          "e2e-test-status": ":fast_forward: Skipped",
          "branch": "${{ github.ref }}",
          "repository": "${{ github.repository }}",
          "commit-author": "check-signing-key-expiry",
          "lint-status": ":fast_forward: Skipped",
          "license-check": ":fast_forward: Skipped",
          "module-check": ":fast_forward: Skipped"
        }
